<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Ita Vilela — Andamento da obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1d2329; --mute:#6b737b; --line:#e2ded6;
  --s0:#9aa3ab; --s1:#e5a823; --s2:#2f9e5b; --accent:#1f4e79;
  --s0f:rgba(154,163,171,.30); --s1f:rgba(229,168,35,.40); --s2f:rgba(47,158,91,.42);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#1d2329;color:#fff;flex-wrap:wrap}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
header .sub{font-size:12px;color:#b9c0c6}
header .sp{flex:1}
.mode{display:flex;align-items:center;gap:8px;font-size:12px}
.switch{position:relative;width:38px;height:22px;border-radius:11px;background:#4a535b;border:0;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--s2)} .switch.on::after{left:19px}
.tabs{display:flex;gap:4px;padding:8px 14px 0;background:var(--bg);overflow-x:auto}
.tab{border:1px solid var(--line);border-bottom:0;background:#ebe7e0;padding:7px 12px;border-radius:8px 8px 0 0;font-size:13px;color:var(--mute);white-space:nowrap}
.tab.on{background:var(--panel);color:var(--ink);font-weight:600}
.tab[disabled]{opacity:.55;cursor:default}
a.tab{text-decoration:none;display:inline-block}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;height:calc(100% - 92px);background:var(--panel);border-top:1px solid var(--line)}
#mapwrap{position:relative;overflow:hidden;background:#fbfaf8;touch-action:none}
#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.legend{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11.5px;display:flex;gap:10px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.filters{position:absolute;left:10px;top:10px;right:56px;display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.filters::-webkit-scrollbar{display:none}
.chip{flex:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;font-size:12px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sumbox{padding:14px 16px;border-bottom:1px solid var(--line)}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:30px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.bar{height:8px;border-radius:4px;background:#ece8e1;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.cats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;margin-top:12px;font-size:12px}
.cats span.n{font-family:"IBM Plex Mono",monospace;color:var(--mute);font-size:11.5px}
.views{display:flex;border-bottom:1px solid var(--line)}
.views button{flex:1;border:0;background:none;padding:10px 4px;font-size:12.5px;color:var(--mute);border-bottom:2px solid transparent}
.views button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
#side{flex:1;overflow:auto;padding:14px 16px 30px}
.hint{color:var(--mute);font-size:13px;line-height:1.5}
.det h2{font-size:17px;margin:0 0 2px}
.det .meta{color:var(--mute);font-size:12px;margin-bottom:10px}
.spec{display:grid;grid-template-columns:92px 1fr;gap:4px 8px;font-size:12.5px;background:#f7f5f1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.spec dt{color:var(--mute)} .spec dd{margin:0}
.svc{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0ece6}
.svc .nm{flex:1;font-size:13.5px}
.svc .when{font-size:11px;color:var(--mute);display:block}
.pill{border:0;border-radius:12px;padding:4px 10px;font-size:12px;font-weight:600;color:#fff;min-width:96px;text-align:center}
.p0{background:var(--s0)} .p1{background:var(--s1);color:#3b2a00} .p2{background:var(--s2)}
.pill.ro{cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 8px;font-size:11.5px;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on0{background:var(--s0);color:#fff}.seg button.on1{background:var(--s1);color:#3b2a00}.seg button.on2{background:var(--s2);color:#fff}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row label{font-size:12px;color:var(--mute);width:92px}
input[type=number],input[type=text]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:#fff;flex:1;min-width:0}
select,textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:#fff;flex:1;min-width:0}
textarea{width:100%;min-height:54px;resize:vertical}
.wlist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.wbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;text-align:left;font-size:12.5px}
.wbtn .mini{width:46px;flex:none}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:16px 0 4px;font-weight:600}
.back{border:0;background:none;color:var(--accent);padding:0;margin-bottom:8px;font-size:12.5px}
table.qt{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
table.qt th{text-align:left;font-weight:600;color:var(--mute);font-size:11px;padding:4px 3px;border-bottom:1px solid var(--line)}
table.qt td{padding:6px 3px;border-bottom:1px solid #f0ece6;vertical-align:top}
table.qt td.n{text-align:right;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
table.qt tr{cursor:pointer} table.qt tr.on td{background:#e8eef5} table.qt tr.sec td{color:var(--mute)}
table.qt td.ok{color:var(--s2)} table.qt td.bad{color:#c0392b;font-weight:600}
input.orc{width:64px;font-size:12px;padding:3px 4px;text-align:right;border:1px solid var(--line);border-radius:5px}
.todo .grp{margin-bottom:12px}
.todo .grp b{display:block;font-size:13px;margin-bottom:3px;cursor:pointer;color:var(--accent)}
.todo .grp div{font-size:12.5px;color:var(--ink);padding:1px 0 1px 10px;border-left:2px solid var(--line)}
.todo .tg{font-size:11px;color:var(--mute)}
.banner{background:#fff4d6;border:1px solid #f0d58a;color:#5a4300;border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
svg .room{cursor:pointer;stroke:#5b6670;stroke-width:.5}
svg .room.sel{stroke:#1f4e79;stroke-width:2}
svg .room.fade{fill:rgba(255,255,255,0)!important;stroke:rgba(91,102,112,.25)}
svg .wall{cursor:pointer;stroke-linecap:round}
svg .wall.sel{stroke:#1f4e79!important}
svg .lbl{font-size:8px;font-family:"IBM Plex Sans",sans-serif;fill:#1d2329;pointer-events:none;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:1.6px}
svg .lbl.wnum{font-size:4px;font-weight:500;fill:#4b555e;stroke-width:1.2px}
svg .lbl.pct{font-size:7px;font-family:"IBM Plex Mono",monospace;font-weight:500}
@media (max-width: 820px){
  main{grid-template-columns:1fr;grid-template-rows:68vh auto;height:auto}
  #mapwrap{height:68vh}
  aside{border-left:0;border-top:1px solid var(--line)}
  #side{overflow:visible}
  header .sub{display:none}
}
</style>
</head>

  ["rev","Revestimento parede"],["imp","Impermeabilização"],["hid","Hidrossanitária"],["piso","Piso"],["rod","Rodapé"],["forro","Forro"],["limp","Limpeza"]
];
const CATN = Object.fromEntries(CATS);
const TIPOS = {exist:"Parede existente",nova:"Alvenaria nova",drywall:"Drywall novo",demolir:"A demolir"};
const ACABS = {pint:"Pintura",rev:"Revestimento cerâmico",aditivo:"Porcelanato — trocado da pintura (aditivo)",nada:"Sem acabamento no escopo"};

/* ---------- serviços ---------- */
function roomServices(r){
  const L=[];
  if(r.tipo==="seco"||r.tipo==="molhado"){
    if(r.demol) L.push(["demol","Demolições e remoções","dem"]);
    if(r.tipo==="molhado"){ L.push(["imper","Impermeabilização","imp"]); L.push(["hidro","Pontos de água e esgoto","hid"]); }
    L.push(["contrapiso","Contrapiso / regularização","piso"]);
    L.push(["piso","Piso","piso"]);
    if(r.rodape && !r.rodape.startsWith("—")) L.push(["rodape","Rodapé","rod"]);
    if(!/^Sem forro/.test(r.forro||"")) { L.push(["forro","Forro","forro"]); L.push(["pintforro","Pintura do forro","pint"]); }
    if(r.tipo==="molhado") L.push(["loucas","Louças e metais","hid"]);
    L.push(["limpeza","Limpeza final","limp"]);
  } else if(r.id==="circ2830"){
    L.push(["demol","Remoção do piso do estacionamento","dem"],["base","Base / sub-base","piso"],["inter","Piso intertravado","piso"],["tatil","Piso tátil","piso"],["limpeza","Limpeza final","limp"]);
  } else if(r.id==="circ1299"){
    L.push(["pedras","Pedras pentagonais em concreto","piso"],["limpeza","Limpeza final","limp"]);
  } else if(r.id==="escada"){
    L.push(["demol","Demolição da escada interna antiga","dem"],["estr","Estrutura da escada nova","alv"],["reb","Reboco das laterais","reb"],["pint","Pintura","pint"]);
  }
  return L;
}
function wallServices(w,st){
  const t=(st&&st.tipo)||w.tipo, a=(st&&st.acab)||w.acabDef;
  if(t==="demolir") return [["dem","Demolição da parede","dem"]];
  const L=[];
  if(t==="nova") L.push(["alv","Alvenaria","alv"],["chap","Chapisco","reb"],["reb","Reboco / emboço","reb"]);
  else if(t==="drywall") L.push(["alv","Estrutura e placas de drywall","alv"],["juntas","Tratamento de juntas","reb"]);
  else L.push(["prep","Preparo / reparo da base","reb"]);
  if(a==="pint") L.push(["massa","Massa corrida","pint"],["pint","Pintura","pint"]);
  else if(a==="aditivo"){ L.push(["remov","Preparo da base para porcelanato","reb"],["assent","Assentamento do porcelanato","rev"],["rejunte","Rejunte","rev"]);
    const H=wallH(w.room), ah=num(st&&st.altAd); if(ah!=null && ah < H-0.05) L.push(["massa","Massa corrida (acima do porcelanato)","pint"],["pint","Pintura (acima do porcelanato)","pint"]); }
  else if(a==="rev") L.push(["assent","Assentamento do revestimento","rev"],["rejunte","Rejunte","rev"]);
  return L;
}

/* ---------- estado ---------- */
const S = {};            // id -> doc data
let db=null, user=null, canWrite=false, edit=false, myId=null;
let sel=null, cat="geral", view="det", loadState="loading", qsel=null; let ORC={};
const ELS = {}; // id -> {kind, room, wall}
ROOMS.forEach(r=>{
  ELS[r.id]={kind:"room",room:r};
  r.walls.forEach((w,i)=>{ w.acabDef = r.tipo==="molhado" ? "rev" : "pint"; w.room=r; w.n=w.seq||i+1; ELS[w.id]={kind:"wall",room:r,wall:w}; });
});
function svcList(id){ const e=ELS[id]; return e.kind==="room"?roomServices(e.room):wallServices(e.wall,S[id]); }
function sv(id,key){ const d=S[id]; return (d&&d.svc&&d.svc[key]&&d.svc[key].s)||0; }
function elStats(id,c){
  let n=0,t=0; for(const [k,,kc] of svcList(id)){ if(c!=="geral"&&kc!==c) continue; n++; t+=sv(id,k); }
  return {n,t};
}
function roomStats(r,c,withWalls=true){
  const a=elStats(r.id,c); let n=a.n,t=a.t;
  if(withWalls) r.walls.forEach(w=>{const b=elStats(w.id,c); n+=b.n; t+=b.t;});
  return {n,t};
}
function stOf(s){ if(!s.n) return -1; if(s.t===0) return 0; if(s.t===2*s.n) return 2; return 1; }
function pct(s){ return s.n? Math.round(100*s.t/(2*s.n)) : 0; }
const FILL=["var(--s0f)","var(--s1f)","var(--s2f)"], STROKE=["#8d969e","#e5a823","#2f9e5b"];

/* ---------- mapa ---------- */
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("map");
let vb={...VB};
function setVB(){ svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function mk(t,a,p){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); (p||svg).appendChild(e); return e; }
const img=mk("image",{href:BG,x:VB.x,y:VB.y,width:VB.w,height:VB.h,opacity:.85});
const gRooms=mk("g",{}), gWalls=mk("g",{}), gLbl=mk("g",{});
function inset(w,r){
  const [x1,y1]=w.a,[x2,y2]=w.b, cx=r.c[0], cy=r.c[1];
  const L=Math.hypot(x2-x1,y2-y1), ux=(x2-x1)/L, uy=(y2-y1)/L; let nx=-uy, ny=ux;
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  if(((mx+nx*3-cx)**2+(my+ny*3-cy)**2) > ((mx-cx)**2+(my-cy)**2)) { nx=-nx; ny=-ny; }
  const o=2.6, sh=Math.min(5,L*.12);
  return [x1+ux*sh+nx*o, y1+uy*sh+ny*o, x2-ux*sh+nx*o, y2-uy*sh+ny*o];
}
ROOMS.forEach(r=>{
  const p=mk("polygon",{points:r.poly.map(q=>q.join(",")).join(" "),class:"room"},gRooms);
  r.el=p;
  const scope = svcList(r.id).length>0 || r.walls.length>0;
  if(!scope){ p.style.fill= r.tipo==="jardim"?"rgba(90,160,90,.10)":"rgba(160,160,160,.12)"; p.style.strokeDasharray="2 2"; }
  p.addEventListener("click",ev=>{ev.stopPropagation(); select(r.id);});
  r.walls.forEach(w=>{
    const [a,b,c,d]=inset(w,r);
    const hit=mk("line",{x1:a,y1:b,x2:c,y2:d,stroke:"transparent","stroke-width":9,class:"wall"},gWalls);
    const ln=mk("line",{x1:a,y1:b,x2:c,y2:d,"stroke-width":2.6,class:"wall",style:"pointer-events:none"},gWalls);
    w.el=ln;
    const wn=mk("text",{x:(a+c)/2,y:(b+d)/2+1.4,"text-anchor":"middle",class:"lbl wnum"},gLbl); wn.textContent=w.n;
    hit.addEventListener("click",ev=>{ev.stopPropagation(); select(w.id);});
  });
  if(scope && r.tipo!=="tec"){
    const nm=r.nome.replace(/ –.*/,"").replace(/ \(.*\)/,"");
    const t=mk("text",{x:r.c[0],y:r.c[1]-1,"text-anchor":"middle",class:"lbl"},gLbl); t.textContent=nm.length>22?nm.slice(0,21)+"…":nm;
    r.pl=mk("text",{x:r.c[0],y:r.c[1]+8,"text-anchor":"middle",class:"lbl pct"},gLbl);
  }
});
svg.addEventListener("click",()=>{ select(null); });
/* ---------- medidas ---------- */
const MAT={bia:"Porcelanato Bianco Plus 60×60",kha:"Porcelanato Khali Off White 90×90",bal:"Porcelanato Bali Camel 19×90",vin:"Vinílico Tarkett Cinnamon",cim:"Piso cimentício 30×30"};
const PROJ={bia:207.53,kha:163.67,bal:13,vin:106,cim:60.32,forro:305.9,junta:null,aditivo:null};
function matOf(r){ const p=r.piso||""; if(/Bianco/.test(p))return"bia"; if(/Khali/.test(p))return"kha"; if(/Bali/.test(p))return"bal"; if(/Vinílico/.test(p))return"vin"; if(/cimentício/.test(p))return"cim"; return null; }
function hasForro(r){ return (r.tipo==="seco"||r.tipo==="molhado") && /^Forro/.test(r.forro||""); }
function polyA(P){ let a=0; for(let i=0;i<P.length;i++){const [x1,y1]=P[i],[x2,y2]=P[(i+1)%P.length]; a+=x1*y2-x2*y1;} return Math.abs(a)/2; }
function polyP(P){ let p=0; for(let i=0;i<P.length;i++){const [x1,y1]=P[i],[x2,y2]=P[(i+1)%P.length]; p+=Math.hypot(x2-x1,y2-y1);} return p; }
const PT=28.35;
ROOMS.forEach(r=>{ const am=polyA(r.poly)/PT/PT; const k=(r.area&&am)?Math.sqrt(r.area/am):1; r.perim=Math.round(polyP(r.poly)/PT*k*100)/100; });
function num(v){ return (v===null||v===undefined||v==="")?null:+v; }
function qPiso(r){ const o=num(S[r.id]&&S[r.id].qPiso); return o??(r.area||0); }
function qForro(r){ const o=num(S[r.id]&&S[r.id].qForro); return o??(r.area||0); }
function qPer(r){ const o=num(S[r.id]&&S[r.id].qPer); return o??r.perim; }
function wallH(r){ const m=((r&&r.forro)||"").match(/H=([\d,]+) ?m/); return m? parseFloat(m[1].replace(",",".")) : 2.40; }
function forroH(r){ const m=(r.forro||"").match(/H=([\d,]+) ?m/); return m?m[1]:"?"; }
function adWalls(){ const L=[]; ROOMS.forEach(r=>r.walls.forEach(w=>{const st=S[w.id]; if(st&&st.acab==="aditivo") L.push([r,w,st]);})); return L; }
function qtyItems(){
  const it=[];
  ["bia","kha","bal"].forEach(k=>{ const rs=ROOMS.filter(r=>matOf(r)===k); it.push({k,nome:MAT[k],un:"m²",rooms:rs,val:rs.reduce((a,r)=>a+qPiso(r),0),per:r=>qPiso(r)}); });
  const ad=adWalls(); it.push({k:"aditivo",nome:"Porcelanato em parede (aditivo)",un:"m²",rooms:[...new Set(ad.map(x=>x[0]))],val:ad.reduce((a,[r,w,st])=>a+((st.compAd??w.comp)*(st.altAd||0)),0),
     per:r=>ad.filter(x=>x[0]===r).reduce((a,[rr,w,st])=>a+((st.compAd??w.comp)*(st.altAd||0)),0)});
  const fr=ROOMS.filter(hasForro);
  it.push({k:"forro",nome:"Forro (área)",un:"m²",rooms:fr,val:fr.reduce((a,r)=>a+qForro(r),0),per:r=>qForro(r)});
  it.push({k:"junta",nome:"Junta de dilatação (perímetro do forro)",un:"m",rooms:fr,val:fr.reduce((a,r)=>a+qPer(r),0),per:r=>qPer(r)});
  ["vin","cim"].forEach(k=>{ const rs=ROOMS.filter(r=>matOf(r)===k); it.push({k,nome:MAT[k],un:"m²",rooms:rs,val:rs.reduce((a,r)=>a+qPiso(r),0),per:r=>qPiso(r),sec:true}); });
  return it;
}
function paint(){
  ROOMS.forEach(r=>{
    const scope = svcList(r.id).length>0 || r.walls.length>0;
    if(qsel){
      const Q=qtyItems().find(q=>q.k===qsel), on=Q&&Q.rooms.includes(r);
      r.el.classList.toggle("fade",!on); r.el.style.fill=on?"rgba(31,78,121,.30)":"";
      if(r.pl) r.pl.textContent = on? fmt(Q.per(r))+" "+Q.un : "";
      r.el.classList.toggle("sel",sel===r.id);
      r.walls.forEach(w=>{ w.el.style.stroke="rgba(120,120,120,.18)"; w.el.style.strokeDasharray=""; });
      return;
    }
    if(scope){
      const s=roomStats(r,cat), k=stOf(s);
      r.el.classList.toggle("fade",k<0);
      r.el.style.fill = k<0? "" : FILL[k];
      if(r.pl) r.pl.textContent = k<0? "" : pct(s)+"%";
    }
    r.el.classList.toggle("sel",sel===r.id);
    r.walls.forEach(w=>{
      const s=elStats(w.id,cat), k=stOf(s);
      w.el.style.stroke = k<0? "rgba(120,120,120,.18)" : STROKE[k];
      w.el.style.strokeWidth = sel===w.id? 4.2 : 2.6;
      const ad=(S[w.id]&&S[w.id].acab)==="aditivo";
      if(ad){ w.el.style.stroke="#8e2fc4"; w.el.style.strokeWidth = sel===w.id? 4.6 : 3.4; w.el.style.strokeDasharray = k===2? "" : "3.5 1.6"; }
      else w.el.style.strokeDasharray="";
      w.el.classList.toggle("sel",sel===w.id);
    });
  });
}
/* zoom / pan */
function zoomAt(f,cx,cy){
  const nw=Math.min(VB.w*1.2,Math.max(70,vb.w*f)), k=nw/vb.w;
  if(cx==null){cx=vb.x+vb.w/2; cy=vb.y+vb.h/2;}
  vb.x=cx-(cx-vb.x)*k; vb.y=cy-(cy-vb.y)*k; vb.w=nw; vb.h=vb.h*k; setVB();
}
function fit(){
  const r=svg.getBoundingClientRect(), ar=r.width/r.height, war=VB.w/VB.h;
  if(ar>war){ vb.h=VB.h+10; vb.w=vb.h*ar; vb.y=VB.y-5; vb.x=VB.x+VB.w/2-vb.w/2; }
  else { vb.w=VB.w+10; vb.h=vb.w/ar; vb.x=VB.x-5; vb.y=VB.y+VB.h/2-vb.h/2; }
  setVB();
}
document.getElementById("zin").onclick=()=>zoomAt(.7);
document.getElementById("zout").onclick=()=>zoomAt(1/.7);
document.getElementById("zfit").onclick=fit;
function toSvg(x,y){ const r=svg.getBoundingClientRect(); return [vb.x+(x-r.left)/r.width*vb.w, vb.y+(y-r.top)/r.height*vb.h]; }
svg.addEventListener("wheel",e=>{e.preventDefault(); const [x,y]=toSvg(e.clientX,e.clientY); zoomAt(e.deltaY>0?1.15:1/1.15,x,y);},{passive:false});
const ptrs=new Map(); let pan=null, pinch=null, moved=false;
svg.addEventListener("pointerdown",e=>{ ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
  if(ptrs.size===1) pan={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w}; pan=null; }
});
svg.addEventListener("pointermove",e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=svg.getBoundingClientRect();
  if(pinch && ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    const [cx,cy]=toSvg((a.x+b.x)/2,(a.y+b.y)/2); zoomAt((pinch.w*pinch.d/d)/vb.w,cx,cy); moved=true; return; }
  if(pan){ const dx=e.clientX-pan.x, dy=e.clientY-pan.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    if(moved){ vb.x=pan.vx-dx/r.width*vb.w; vb.y=pan.vy-dy/r.height*vb.h; setVB(); } }
});
function up(e){ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; if(ptrs.size===0) pan=null; }
svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",up);
svg.addEventListener("click",e=>{ if(moved){ e.stopPropagation(); moved=false; } },true);

/* ---------- filtros e resumo ---------- */
const fbox=document.getElementById("filters");
CATS.forEach(([k,n])=>{ const b=document.createElement("button"); b.className="chip"+(k==="geral"?" on":""); b.textContent=n; b.dataset.k=k;
  b.onclick=()=>{cat=k; qsel=null; [...fbox.children].forEach(c=>c.classList.toggle("on",c.dataset.k===k)); paint(); if(view==="todo") renderSide();}; fbox.appendChild(b); });
function totals(){
  const per={}; let n=0,t=0,c0=0,c1=0,c2=0;
  for(const id in ELS){ for(const [k,,kc] of svcList(id)){ const s=sv(id,k); n++; t+=s; (s===0?c0++:s===1?c1++:c2++);
    per[kc]=per[kc]||{n:0,t:0}; per[kc].n++; per[kc].t+=s; } }
  return {n,t,c0,c1,c2,per};
}
function renderSum(){
  const T=totals(), p=pct(T);
  let h=`<div class="big"><b>${p}%</b><span class="hint">do térreo concluído (${T.c2} de ${T.n} serviços)</span></div>
  <div class="bar" style="margin-top:8px"><i style="width:${100*T.c2/T.n}%;background:var(--s2)"></i><i style="width:${100*T.c1/T.n}%;background:var(--s1)"></i></div>
  <div class="cats">`;
  CATS.slice(1).forEach(([k,n])=>{ const s=T.per[k]; if(!s) return; const q=pct(s);
    h+=`<span>${n}</span><div class="bar"><i style="width:${q}%;background:var(--s2)"></i></div><span class="n">${q}%</span>`; });
  h+=`</div>`;
  if(loadState==="loading") h+=`<div class="hint" style="margin-top:8px">Carregando andamento…</div>`;
  if(loadState==="offline") h+=`<div class="banner" style="margin-top:10px">Não foi possível carregar o andamento salvo agora. O mapa mostra tudo como não iniciado.</div>`;
  document.getElementById("sumbox").innerHTML=h;
}

function vbtns(){ document.getElementById("vDet").classList.toggle("on",view==="det"); document.getElementById("vTodo").classList.toggle("on",view==="todo"); document.getElementById("vAd").classList.toggle("on",view==="ad"); document.getElementById("vQt").classList.toggle("on",view==="qty"); document.getElementById("vMed").classList.toggle("on",view==="med"); }
function select(id){ sel=id; if(view!=="det"){ view="det"; } side.scrollTop=0;  vbtns(); paint(); renderSide(); if(id && innerWidth<=820) document.querySelector(".views").scrollIntoView({behavior:"smooth"}); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtD(d){ if(!d) return ""; const x=new Date(d); return x.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}); }
const names={};
async function resolveNames(ids){
  if(!user||!user.profiles) return; const need=ids.filter(i=>i&&!(i in names)); if(!need.length) return;
  try{ const ps=await user.profiles(need); need.forEach(i=>names[i]=(ps[i]&&ps[i].name)||""); renderSide(); }catch(e){}
}
function svcRows(id){
  const L=svcList(id), d=S[id]||{}, ids=[];
  let h="";
  L.forEach(([k,n])=>{
    const s=sv(id,k), info=(d.svc&&d.svc[k])||{};
    if(info.by) ids.push(info.by);
    const who = info.by && names[info.by] ? " · "+esc(names[info.by]) : "";
    const when = info.d ? `<span class="when">${ST[s]} em ${fmtD(info.d)}${who}</span>` : "";
    let ctl;
    if(edit) ctl=`<div class="seg">${[0,1,2].map(v=>`<button class="${s===v?"on"+v:""}" data-id="${id}" data-k="${k}" data-v="${v}">${["Não","Andam.","Feito"][v]}</button>`).join("")}</div>`;
    else ctl=`<span class="pill ro p${s}">${ST[s]}</span>`;
    h+=`<div class="svc"><div class="nm">${esc(n)}${when}</div>${ctl}</div>`;
  });
  if(!L.length) h+=`<div class="hint">Fora do escopo da Vieira&amp;Silva (sem serviços acompanhados).</div>`;
  resolveNames(ids);
  return h;
}
function obsBlock(id){
  const o=(S[id]&&S[id].obs)||"";
  if(edit) return `<h3>Observação</h3><textarea id="obs" data-id="${id}" placeholder="Ex.: falta segunda demão; aguardando material…">${esc(o)}</textarea>`;
  return o? `<h3>Observação</h3><div class="hint" style="color:var(--ink)">${esc(o)}</div>`:"";
}
function bulk(id){
  if(!edit || !svcList(id).length) return "";
  return `<div class="row" style="margin-top:10px"><button class="btn" data-bulk="${id}" data-v="0">Zerar</button><button class="btn pri" data-bulk="${id}" data-v="2">Marcar tudo concluído</button></div>`;
}
function renderSide(){
  renderSum();
  if(view==="todo") return renderTodo();
  if(view==="ad") return renderAd();
  if(view==="qty") return renderQty();
  if(view==="med") return renderMed();
  if(!sel){
    side.innerHTML=`<p class="hint">Toque numa <b>sala</b> para ver piso, forro, impermeabilização e hidrossanitária, ou numa <b>parede</b> (as faixas coloridas junto às paredes) para ver a sequência de alvenaria, reboco, massa, pintura ou revestimento.</p>
    <p class="hint">Use os filtros acima do mapa para colorir por um serviço só, por exemplo ver só <b>Forro</b> ou só <b>Massa e pintura</b>.</p>
    <p class="hint">A aba <b>O que falta</b> lista tudo que ainda não foi concluído.</p>
    ${canWrite?`<p class="hint">Para marcar serviços, ligue o <b>modo edição</b> no topo.</p>`:""}`;
    return;
  }
  const e=ELS[sel];

/* ---------- medição ---------- */
function done(id,k){ return sv(id,k)===2; }
function medData(){
  const G={}, A={}, det=[];
  const add=(T,key,nome,un,tot,ex)=>{ T[key]=T[key]||{nome,un,tot:0,ex:0}; T[key].tot+=tot; T[key].ex+=ex; };
  ROOMS.forEach(r=>{
    const ids=svcList(r.id).map(x=>x[0]), has=k=>ids.includes(k), d=k=>done(r.id,k);
    if(r.tipo==="seco"||r.tipo==="molhado"){
      const ap=qPiso(r), af=qForro(r), pr=qPer(r);
      if(has("contrapiso")) add(G,"01","Contrapiso / regularização","m²",ap,d("contrapiso")?ap:0);
      const m=matOf(r);
      if(has("piso")) add(G,"02"+(m||"x"),"Piso — "+(m?MAT[m]:(r.piso||"a definir")),"m²",ap,d("piso")?ap:0);
      if(has("rodape")) add(G,"03","Rodapé","m",pr,d("rodape")?pr:0);
      if(has("imper")) add(G,"04","Impermeabilização","m²",ap,d("imper")?ap:0);
      if(has("forro")&&hasForro(r)) add(G,"20","Forro","m²",af,d("forro")?af:0);
      if(has("forro")&&hasForro(r)) add(G,"21","Junta de dilatação do forro (perímetro)","m",pr,d("forro")?pr:0);
      if(has("pintforro")&&hasForro(r)) add(G,"22","Pintura do forro","m²",af,d("pintforro")?af:0);
    }
    r.walls.forEach(w=>{
      const st=S[w.id]||{}, t=st.tipo||w.tipo, a=st.acab||w.acabDef, H=wallH(r), L=num(st.compAd)??w.comp, id=w.id;
      if(t==="demolir"){ add(G,"05","Demolição de parede","m²",L*H,done(id,"dem")?L*H:0); return; }
      const ar=L*H;
      if(t==="nova"){ add(G,"10","Alvenaria nova","m²",ar,done(id,"alv")?ar:0); add(G,"11","Parede chapiscada e rebocada","m²",ar,(done(id,"chap")&&done(id,"reb"))?ar:0); }
      else if(t==="drywall"){ add(G,"12","Drywall","m²",ar,done(id,"alv")?ar:0); add(G,"13","Tratamento de juntas (drywall)","m²",ar,done(id,"juntas")?ar:0); }
      else add(G,"14","Preparo / reparo de base (parede existente)","m²",ar,done(id,"prep")?ar:0);
      if(a==="pint"){ add(G,"15","Parede emassada","m²",ar,done(id,"massa")?ar:0); add(G,"16","Parede pintada","m²",ar,done(id,"pint")?ar:0); }
      else if(a==="rev"){ add(G,"17","Revestimento cerâmico de parede (projeto)","m²",ar,(done(id,"assent")&&done(id,"rejunte"))?ar:0); }
      else if(a==="aditivo"){
        const ah=num(st.altAd)??H, pa=L*Math.min(ah,H), rest=Math.max(0,H-ah)*L;
        add(A,"a1","Preparo da base para porcelanato","m²",pa,done(id,"remov")?pa:0);
        add(A,"a2","Porcelanato em parede (aditivo)","m²",pa,(done(id,"assent")&&done(id,"rejunte"))?pa:0);
        if(rest>0.01){ add(G,"15","Parede emassada","m²",rest,done(id,"massa")?rest:0); add(G,"16","Parede pintada","m²",rest,done(id,"pint")?rest:0); }
        det.push({amb:r.nome,par:`Parede ${w.n} (${w.lado})`,L,ah,area:pa,semAlt:num(st.altAd)==null,feito:(done(id,"assent")&&done(id,"rejunte"))});
      }
    });
  });
  const ord=T=>Object.keys(T).sort().map(k=>T[k]);
  return {G:ord(G),A:ord(A),det};
}
const f2=n=>Number(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function medTable(rows){
  return `<table class="qt"><thead><tr><th>Serviço</th><th>Un</th><th>Total</th><th>Executado</th><th>%</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.un}</td><td class="n">${f2(x.tot)}</td><td class="n"><b>${f2(x.ex)}</b></td><td class="n">${x.tot?Math.round(100*x.ex/x.tot):0}%</td></tr>`).join("")}</tbody></table>`;
}

    if(M.det.some(d=>d.semAlt)) h+=`<p class="hint" style="font-size:11.5px">* altura não informada na parede: usada a altura do forro.</p>`;
  }
  side.innerHTML=h;

function medRowsText(M,sep,num){
  const L=[];
  const sec=(t,rows)=>{ L.push([t]); L.push(["Serviço","Un","Total","Executado","Saldo","% executado"]); rows.forEach(x=>L.push([x.nome,x.un,num(x.tot),num(x.ex),num(x.tot-x.ex),(x.tot?Math.round(100*x.ex/x.tot):0)+"%"])); L.push([]); };
  L.push(["Clínica Ita Vilela — Térreo — Medição "+new Date().toLocaleDateString("pt-BR")]); L.push([]);
  sec("CONTRATO — QUANTIDADES GERAIS",M.G);
  sec("ADITIVO",M.A);
  if(M.det.length){ L.push(["ADITIVO POR PAREDE"]); L.push(["Ambiente","Parede","Comprimento (m)","Altura (m)","Área (m²)","Executado"]);
    M.det.forEach(d=>L.push([d.amb,d.par,num(d.L),num(d.ah)+(d.semAlt?" (altura do forro)":""),num(d.area),d.feito?"sim":"não"])); }
  return L.map(r=>r.map(c=>{ c=String(c??""); return /[";\n\t]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(sep)).join("\r\n");
}
async function exportCsv(M){

const pending={}; let writeBlocked=false;
async function saveDoc(id,patch){
  const cur=JSON.parse(JSON.stringify(S[id]||{}));
  const next=Object.assign(cur,patch,{at:new Date().toISOString(),by:myId||null});
  S[id]=next; paint(); renderSide();
  if(!db){ toast("Sem conexão com o banco: a alteração não foi salva."); return; }
  pending[id]=(pending[id]||Promise.resolve()).then(()=>db.doc("el/"+id).set(next)).catch(err=>{
    if(err&&err.code==="invalid_argument"){ writeBlocked=true; canWrite=false; edit=false; setMode(); toast("Você tem acesso só de visualização."); }
    else toast("Não foi possível salvar agora. Tente de novo.");
  });
}
async function saveOrc(k,v){
  ORC=Object.assign({},ORC,{[k]:v}); renderSide();
  if(!db){ toast("Sem conexão com o banco: o valor não foi salvo."); return; }
  try{ await db.doc("cfg/orcamento").set(ORC); }catch(err){ toast("Não foi possível salvar o valor orçado."); }
}
function setSvc(id,changes){
  const cur=JSON.parse(JSON.stringify((S[id]&&S[id].svc)||{})); const now=new Date().toISOString(); let ch=false;
  for(const k in changes){ const v=changes[k]; if(((cur[k]&&cur[k].s)||0)===v) continue; cur[k]={s:v,d:now,by:myId||null}; ch=true; }
  if(ch) saveDoc(id,{svc:cur});
}
function toast(m){ const b=document.createElement("div"); b.className="banner"; b.textContent=m; side.prepend(b); setTimeout(()=>b.remove(),5000); }

/* ---------- modo ---------- */
const sw=document.getElementById("modesw");
function setMode(){ document.getElementById("modebox").style.display=canWrite?"flex":"none"; sw.classList.toggle("on",edit); document.getElementById("modelbl").textContent=edit?"Modo edição":"Visualização"; renderSide(); }
sw.onclick=()=>{ edit=!edit; setMode(); };

/* ---------- init ---------- */
fit(); paint(); renderSide();
addEventListener("resize",()=>{fit();});
(async()=>{
  if(!window.claude||!claude.use){ loadState="offline"; renderSum(); return; }
  try{ user=await claude.use("user"); }catch(e){ user=null; }
  try{ db=await claude.use("db"); }catch(e){ db=null; }
  if(user){ try{ myId=await user.id(); }catch(e){} }
  if(db){
    const c = user && user.can ? user.can("data.write") : null;
    canWrite = c!==false; setMode();
    const timer=setTimeout(()=>{ if(loadState==="loading"){ loadState="offline"; renderSum(); } },10000);
    db.collection("el").onSnapshot(snap=>{
      if(!snap.metadata.fromCache){ clearTimeout(timer); loadState="ok"; }
      for(const k in S) delete S[k];
      snap.docs.forEach(d=>{ if(d.exists && ELS[d.id]) S[d.id]=JSON.parse(JSON.stringify(d.data())); });
      if(loadState==="loading" && snap.size) loadState="ok";
      paint(); renderSide();
    },err=>{ clearTimeout(timer); loadState="offline"; renderSum(); });
    db.doc("cfg/orcamento").onSnapshot(d=>{ ORC = d.exists? JSON.parse(JSON.stringify(d.data())) : {}; if(view==="qty") renderSide(); },()=>{});
  } else { loadState="offline"; renderSum(); }
})();
</script>
</body>
</html>
